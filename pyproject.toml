[project]
name = "realclimate-catalogue-updater"
version = "0.1.0"
description = "Kafka-based catalogue synchronization services"
authors = [{ name = "RealClimate" }]
requires-python = ">=3.12,<4.0"
dependencies = [
    "apscheduler>=3.11.0,<4.0.0",
    "beautifulsoup4>=4.15.0,<5.0.0",
    "confluent-kafka>=2.11.1,<3.0.0",
    "google-api-python-client>=2.200.0,<3.0.0",
    "google-auth>=2.58.0,<3.0.0",
    "google-auth-oauthlib>=1.4.1,<2.0.0",
    "gspread>=6.2.1,<7.0.0",
    "python-dotenv>=1.2.3,<2.0.0",
    "requests>=2.34.2,<3.0.0",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
black = "^26.5.1"
pytest = "^9.1.1"

[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = '''
(?x)(^|/)duplicate_mapping\.py$
'''

[tool.pytest.ini_options]
testpaths = ["app"]
python_files = ["test_*.py"]
addopts = "-ra"
