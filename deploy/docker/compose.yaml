x-app-build: &app_build
  context: ../..
  dockerfile: deploy/docker/Dockerfile

x-common-env: &common_env
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
  KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:?Set KAFKA_SASL_USERNAME in .env}
  KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:?Set KAFKA_SASL_PASSWORD in .env}
  KAFKA_SSL_CA_LOCATION: /run/secrets/kafka/kafka-ca.pem
  TZ: Europe/Minsk

x-kafka-ca-volume: &kafka_ca_volume kafka_client_certs:/run/secrets/kafka:ro

x-cms-env: &cms_env
  <<: *common_env
  TAPTOP_CMS_URL: ${TAPTOP_CMS_URL:?Set TAPTOP_CMS_URL in .env}

x-auth-env: &auth_env
  <<: *cms_env
  TAPTOP_BASE_URL: ${TAPTOP_BASE_URL:?Set TAPTOP_BASE_URL in .env}
  TAPTOP_USERNAME: ${TAPTOP_USERNAME:?Set TAPTOP_USERNAME in .env}
  TAPTOP_PASSWORD: ${TAPTOP_PASSWORD:?Set TAPTOP_PASSWORD in .env}
  TAPTOP_ACCESS: ${TAPTOP_ACCESS:?Set TAPTOP_ACCESS in .env}
  TAPTOP_VER_ID: ${TAPTOP_VER_ID:?Set TAPTOP_VER_ID in .env}
  TAPTOP_DESIGN_ID: ${TAPTOP_DESIGN_ID:?Set TAPTOP_DESIGN_ID in .env}
  ADMIN_AUTH_SESSION_CACHE_TTL_SECONDS: ${ADMIN_AUTH_SESSION_CACHE_TTL_SECONDS:-14400}

services:
  kafka_certs:
    image: apache/kafka:3.9.1
    user: "0:0"
    entrypoint: ["/bin/bash", "/opt/kafka/certs/generate-certs.sh"]
    environment:
      KAFKA_TLS_STORE_PASSWORD: ${KAFKA_TLS_STORE_PASSWORD:?Set KAFKA_TLS_STORE_PASSWORD in .env}
    volumes:
      - kafka_server_certs:/certs/server
      - kafka_client_certs:/certs/client
      - ./kafka/generate-certs.sh:/opt/kafka/certs/generate-certs.sh:ro
    restart: "no"

  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    depends_on:
      kafka_certs: {condition: service_completed_successfully}
    environment:
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:?Set KAFKA_SASL_USERNAME in .env}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:?Set KAFKA_SASL_PASSWORD in .env}
      KAFKA_TLS_STORE_PASSWORD: ${KAFKA_TLS_STORE_PASSWORD:?Set KAFKA_TLS_STORE_PASSWORD in .env}
    entrypoint: ["/bin/bash", "/opt/kafka/custom/broker-entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/kafka-ready"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped
    volumes:
      - kafka_data:/var/lib/kafka/data
      - kafka_server_certs:/run/secrets/kafka-server:ro
      - kafka_client_certs:/run/secrets/kafka-client:ro
      - ./kafka/broker-entrypoint.sh:/opt/kafka/custom/broker-entrypoint.sh:ro

  kafka_init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka: {condition: service_healthy}
    environment:
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:?Set KAFKA_SASL_USERNAME in .env}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:?Set KAFKA_SASL_PASSWORD in .env}
      KAFKA_TLS_STORE_PASSWORD: ${KAFKA_TLS_STORE_PASSWORD:?Set KAFKA_TLS_STORE_PASSWORD in .env}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        cat >/tmp/kafka-client.properties <<EOF
        security.protocol=SASL_SSL
        sasl.mechanism=SCRAM-SHA-512
        sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_SASL_USERNAME}" password="${KAFKA_SASL_PASSWORD}";
        ssl.truststore.location=/run/secrets/kafka/kafka.truststore.p12
        ssl.truststore.password=${KAFKA_TLS_STORE_PASSWORD}
        ssl.truststore.type=PKCS12
        EOF
        chmod 600 /tmp/kafka-client.properties
        create_topic() {
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --command-config /tmp/kafka-client.properties --create --if-not-exists --partitions 1 --replication-factor 1 "$@"
        }
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --command-config /tmp/kafka-client.properties --create --if-not-exists --partitions 3 --replication-factor 1 --topic core.process.results
        create_topic --topic reference.sync.requests
        create_topic --topic downloader.reference.completed
        create_topic --topic reference.pipeline.completed
        create_topic --topic downloader.current.completed
        create_topic --topic admin-auth.requests
        create_topic --topic admin-auth.current.responses
        create_topic --topic admin-auth.uploader.responses
        create_topic --topic notifications_bot
        create_topic --topic health.heartbeats
        create_topic --topic rate.limit.requests --config retention.ms=3600000
        create_topic --topic rate.limit.responses --config retention.ms=3600000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --command-config /tmp/kafka-client.properties \
          --create --if-not-exists --topic core.duplicate-map.state \
          --partitions 1 --replication-factor 1 --config cleanup.policy=compact
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --command-config /tmp/kafka-client.properties \
          --create --if-not-exists --topic reference.snapshot.state \
          --partitions 1 --replication-factor 1 --config cleanup.policy=compact
    volumes:
      - *kafka_ca_volume
    restart: "no"

  kafka_tls_integration_test:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.test
    profiles: ["integration"]
    command:
      - python
      - -m
      - unittest
      - app.messaging.tests.test_messaging_kafka_tls_integration
      - -v
    environment:
      <<: *common_env
      KAFKA_TLS_INTEGRATION: "1"
    volumes:
      - *kafka_ca_volume
    depends_on:
      kafka_init: {condition: service_completed_successfully}
    restart: "no"

  admin_auth:
    build: *app_build
    command: ["python", "-m", "app.admin_auth.consumer"]
    # Only the authentication service receives account credentials.
    # Other CMS workers receive the access parameters they use directly.
    environment: *auth_env
    volumes:
      - *kafka_ca_volume
    depends_on:
      kafka_init: {condition: service_completed_successfully}
      rate_limiter: {condition: service_started}
    restart: unless-stopped

  downloader_current:
    build: *app_build
    command: ["python", "-m", "app.downloader.current.consumer"]
    environment:
      <<: *cms_env
      TAPTOP_ACCESS: ${TAPTOP_ACCESS:?Set TAPTOP_ACCESS in .env}
      TAPTOP_VER_ID: ${TAPTOP_VER_ID:?Set TAPTOP_VER_ID in .env}
      TAPTOP_SHOP_ID: ${TAPTOP_SHOP_ID:?Set TAPTOP_SHOP_ID in .env}
    volumes:
      - *kafka_ca_volume
    depends_on:
      kafka_init: {condition: service_completed_successfully}
      rate_limiter: {condition: service_started}
      admin_auth: {condition: service_started}
    restart: unless-stopped

  downloader_reference:
    build: *app_build
    command: ["python", "-m", "app.downloader.reference.consumer"]
    environment:
      <<: *common_env
      GOOGLE_SHEET_URL: ${GOOGLE_SHEET_URL:?Set GOOGLE_SHEET_URL in .env}
      GOOGLE_SHEET_NAME: ${GOOGLE_SHEET_NAME:?Set GOOGLE_SHEET_NAME in .env}
      GOOGLE_AUTH_MODE: ${GOOGLE_AUTH_MODE:-user}
      GOOGLE_CREDENTIALS_FILE: /app/app/downloader/reference/credentials/client_secret.json
      GOOGLE_TOKEN_FILE: /app/app/downloader/reference/credentials/token.json
      GOOGLE_SERVICE_ACCOUNT_FILE: /app/app/downloader/reference/credentials/service_account_secret.json
    volumes:
      - *kafka_ca_volume
      - ../../app/downloader/reference/credentials:/app/app/downloader/reference/credentials
    depends_on:
      kafka_init: {condition: service_completed_successfully}
      rate_limiter: {condition: service_started}
    restart: unless-stopped

  core:
    build: *app_build
    command: ["python", "-m", "app.core.consumer"]
    environment:
      <<: *common_env
      EXCLUDED_CSV_PATH: /app/storage/outputs/for_zalivka_excluded.csv
      CORE_PENDING_REDIS_URL: redis://redis:6379/0
      CORE_PENDING_INPUT_TTL_SECONDS: ${CORE_PENDING_INPUT_TTL_SECONDS:-86400}
      CORE_PROCESSING_CLAIM_TTL_SECONDS: ${CORE_PROCESSING_CLAIM_TTL_SECONDS:-7200}
    volumes:
      - *kafka_ca_volume
      - ../../storage/outputs:/app/storage/outputs
    depends_on:
      kafka_init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "60"
      - "1000"
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data
    restart: unless-stopped

  rate_limiter:
    build: *app_build
    command: ["python", "-m", "app.rate_limiter.consumer"]
    environment:
      <<: *common_env
      RATE_LIMITER_REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_CMS_MIN_INTERVAL_MS: ${RATE_LIMIT_CMS_MIN_INTERVAL_MS:-5500}
      RATE_LIMIT_GOOGLE_SHEETS_MIN_INTERVAL_MS: ${RATE_LIMIT_GOOGLE_SHEETS_MIN_INTERVAL_MS:-1112}
      RATE_LIMIT_TELEGRAM_CHAT_MIN_INTERVAL_MS: ${RATE_LIMIT_TELEGRAM_CHAT_MIN_INTERVAL_MS:-3334}
    volumes:
      - *kafka_ca_volume
    depends_on:
      kafka_init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped

  uploader:
    build: *app_build
    command: ["python", "-m", "app.uploader.consumer"]
    environment:
      <<: *cms_env
      TAPTOP_ACCESS: ${TAPTOP_ACCESS:?Set TAPTOP_ACCESS in .env}
      TAPTOP_VER_ID: ${TAPTOP_VER_ID:?Set TAPTOP_VER_ID in .env}
      TAPTOP_SHOP_ID: ${TAPTOP_SHOP_ID:?Set TAPTOP_SHOP_ID in .env}
    volumes:
      - *kafka_ca_volume
    depends_on:
      kafka_init: {condition: service_completed_successfully}
      rate_limiter: {condition: service_started}
      admin_auth: {condition: service_started}
    restart: unless-stopped

  scheduler:
    build: *app_build
    command: ["python", "-m", "app.scheduler.main"]
    environment:
      <<: *common_env
      SCHEDULE_TIMEZONE: ${SCHEDULE_TIMEZONE:-Europe/Minsk}
    depends_on:
      kafka_init: {condition: service_completed_successfully}
    restart: unless-stopped
    volumes:
      - *kafka_ca_volume

  health_monitor:
    build: *app_build
    command: ["python", "-m", "app.health_monitor.main"]
    environment:
      <<: *common_env
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?Set TELEGRAM_CHAT_ID in .env}
      HEALTH_HEARTBEAT_TIMEOUT_SECONDS: ${HEALTH_HEARTBEAT_TIMEOUT_SECONDS:-120}
      HEALTH_STARTUP_GRACE_SECONDS: ${HEALTH_STARTUP_GRACE_SECONDS:-180}
      HEALTH_CHECK_INTERVAL_SECONDS: ${HEALTH_CHECK_INTERVAL_SECONDS:-10}
      HEALTH_MAX_BUSY_SECONDS: ${HEALTH_MAX_BUSY_SECONDS:-5400}
      HEALTH_MAX_BUSY_OVERRIDES: ${HEALTH_MAX_BUSY_OVERRIDES:-}
    volumes:
      - *kafka_ca_volume
    depends_on:
      kafka_init: {condition: service_completed_successfully}
      rate_limiter: {condition: service_started}
    restart: unless-stopped

  notifications_bot:
    build: *app_build
    command: ["python", "-m", "app.notifications.bot.consumer"]
    environment:
      <<: *common_env
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?Set TELEGRAM_CHAT_ID in .env}
    depends_on:
      kafka_init: {condition: service_completed_successfully}
      rate_limiter: {condition: service_started}
    restart: unless-stopped
    volumes:
      - *kafka_ca_volume

  notifications_email:
    build: *app_build
    command: ["python", "-m", "app.notifications.email.consumer"]
    environment:
      <<: *common_env
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:?Set EMAIL_SMTP_HOST in .env}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_SMTP_SECURITY: ${EMAIL_SMTP_SECURITY:-starttls}
      EMAIL_SMTP_USERNAME: ${EMAIL_SMTP_USERNAME:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
      EMAIL_SMTP_TIMEOUT_SECONDS: ${EMAIL_SMTP_TIMEOUT_SECONDS:-15}
      EMAIL_SENDER: ${EMAIL_SENDER:?Set EMAIL_SENDER in .env}
      EMAIL_RECIPIENTS: ${EMAIL_RECIPIENTS:?Set EMAIL_RECIPIENTS in .env}
    depends_on:
      kafka_init: {condition: service_completed_successfully}
    restart: unless-stopped
    volumes:
      - *kafka_ca_volume

volumes:
  kafka_data:
  kafka_server_certs:
  kafka_client_certs:
  redis_data:
