x-app-build: &app_build
  context: ../..
  dockerfile: deploy/docker/Dockerfile

x-common-env: &common_env
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
  TZ: Europe/Minsk

x-cms-env: &cms_env
  <<: *common_env
  TAPTOP_CMS_URL: ${TAPTOP_CMS_URL:?Set TAPTOP_CMS_URL in .env}

x-auth-env: &auth_env
  <<: *cms_env
  TAPTOP_BASE_URL: ${TAPTOP_BASE_URL:?Set TAPTOP_BASE_URL in .env}
  TAPTOP_USERNAME: ${TAPTOP_USERNAME:?Set TAPTOP_USERNAME in .env}
  TAPTOP_PASSWORD: ${TAPTOP_PASSWORD:?Set TAPTOP_PASSWORD in .env}
  TAPTOP_ACCESS: ${TAPTOP_ACCESS:?Set TAPTOP_ACCESS in .env}
  TAPTOP_VER_ID: ${TAPTOP_VER_ID:?Set TAPTOP_VER_ID in .env}
  TAPTOP_DESIGN_ID: ${TAPTOP_DESIGN_ID:?Set TAPTOP_DESIGN_ID in .env}

services:
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 1
      KAFKA_MESSAGE_MAX_BYTES: 80000000
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 80000000
      KAFKA_REPLICA_FETCH_MAX_BYTES: 80000000
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka_init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for topic in \
          core.runs \
          core.run.responses \
          core.current.responses \
          core.reference.responses \
          downloader.current.requests \
          downloader.current.responses \
          downloader.reference.requests \
          downloader.reference.responses \
          admin_auth.requests \
          admin_auth.current.responses \
          admin_auth.uploader.responses \
          uploader.requests \
          core.uploader.responses \
          notifications; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic "$$topic" \
            --partitions 1 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists --topic core.duplicate-map.state \
          --partitions 1 --replication-factor 1 --config cleanup.policy=compact
    restart: "no"

  admin_auth:
    build: *app_build
    command: ["python", "-m", "app.admin_auth.consumer"]
    # Only the authentication service receives account credentials.
    # Other CMS workers receive the access parameters they use directly.
    environment: *auth_env
    depends_on:
      kafka_init: {condition: service_completed_successfully}
    restart: unless-stopped

  downloader_current:
    build: *app_build
    command: ["python", "-m", "app.downloader.current.consumer"]
    environment:
      <<: *cms_env
      TAPTOP_ACCESS: ${TAPTOP_ACCESS:?Set TAPTOP_ACCESS in .env}
      TAPTOP_VER_ID: ${TAPTOP_VER_ID:?Set TAPTOP_VER_ID in .env}
      TAPTOP_SHOP_ID: ${TAPTOP_SHOP_ID:?Set TAPTOP_SHOP_ID in .env}
    depends_on:
      kafka_init: {condition: service_completed_successfully}
      admin_auth: {condition: service_started}
    restart: unless-stopped

  downloader_reference:
    build: *app_build
    command: ["python", "-m", "app.downloader.reference.consumer"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      TZ: Europe/Minsk
      GOOGLE_SHEET_URL: ${GOOGLE_SHEET_URL:?Set GOOGLE_SHEET_URL in .env}
      GOOGLE_SHEET_NAME: ${GOOGLE_SHEET_NAME:?Set GOOGLE_SHEET_NAME in .env}
      GOOGLE_CREDENTIALS_FILE: /run/secrets/google/client_secret.json
      GOOGLE_TOKEN_FILE: /var/lib/app/token.json
    volumes:
      - ../../config/google:/var/lib/app
      - ../../config/google:/run/secrets/google:ro
    depends_on:
      kafka_init: {condition: service_completed_successfully}
    restart: unless-stopped

  core:
    build: *app_build
    command: ["python", "-m", "app.core.consumer"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      TZ: Europe/Minsk
      EXCLUDED_CSV_PATH: /app/storage/outputs/for_zalivka_excluded.csv
      DOWNLOAD_TIMEOUT_SECONDS: ${DOWNLOAD_TIMEOUT_SECONDS:-900}
      IMPORT_TIMEOUT_SECONDS: ${IMPORT_TIMEOUT_SECONDS:-1800}
    volumes:
      - ../../storage/outputs:/app/storage/outputs
    depends_on:
      kafka_init: {condition: service_completed_successfully}
      downloader_current: {condition: service_started}
      downloader_reference: {condition: service_started}
      uploader: {condition: service_started}
    restart: unless-stopped

  uploader:
    build: *app_build
    command: ["python", "-m", "app.uploader.consumer"]
    environment:
      <<: *cms_env
      TAPTOP_ACCESS: ${TAPTOP_ACCESS:?Set TAPTOP_ACCESS in .env}
      TAPTOP_VER_ID: ${TAPTOP_VER_ID:?Set TAPTOP_VER_ID in .env}
      TAPTOP_SHOP_ID: ${TAPTOP_SHOP_ID:?Set TAPTOP_SHOP_ID in .env}
    depends_on:
      kafka_init: {condition: service_completed_successfully}
      admin_auth: {condition: service_started}
    restart: unless-stopped

  scheduler:
    build: *app_build
    command: ["python", "-m", "app.scheduler.main"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      TZ: Europe/Minsk
      SCHEDULE_TIMEZONE: ${SCHEDULE_TIMEZONE:-Europe/Minsk}
      CORE_RUN_TIMEOUT_SECONDS: ${CORE_RUN_TIMEOUT_SECONDS:-3600}
    depends_on:
      kafka_init: {condition: service_completed_successfully}
      core: {condition: service_started}
    restart: unless-stopped

  notifications:
    build: *app_build
    command: ["python", "-m", "app.notifications.consumer"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      TZ: Europe/Minsk
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?Set TELEGRAM_CHAT_ID in .env}
    depends_on:
      kafka_init: {condition: service_completed_successfully}
    restart: unless-stopped

volumes:
  kafka_data:
