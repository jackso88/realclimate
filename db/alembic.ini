# Alembic configuration for the realclimate PostgreSQL schema.
#
# Run from the repository root (or /app in the containers):
#   alembic -c db/alembic.ini upgrade head
#   alembic -c db/alembic.ini revision --autogenerate -m "describe the change"
# The database URL is read from the DATABASE_URL environment variable in
# db/env.py, so no credentials are stored here. Migrations are generated from
# the models in app/db_service/tables.py and are not written by hand.

[alembic]
script_location = %(here)s
prepend_sys_path = %(here)s/..
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
